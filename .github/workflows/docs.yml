name: Docs

# The API reference TypeDoc generates from the docblocks, published to
# GitHub Pages from every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages takes one deployment at a time; a newer push waits for the running one rather than cutting it off.
concurrency:
  group: docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      # typedoc.json: every export of the entry point, the README first, warnings fail the build.
      - run: npm run docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: reference

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      # GitHub Pages checks the deployment against the job's OIDC token.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
